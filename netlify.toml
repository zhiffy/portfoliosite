# Netlify deploy config for shavonnewong.art
# The site is a Vite multi-page static build. Publish the built dist directory,
# which contains the rewritten root-absolute asset paths plus _redirects,
# _headers, sitemap.xml, and robots.txt copied in by the build plugin.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions. by-proxy-listings.js self-routes to /api/by-proxy-listings
# via its exported config.path, so no extra redirect rule is needed.
# It reads the OPENSEA_API_KEY environment variable (set in Netlify site settings).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
